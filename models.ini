[*]
; Use all GPU layers
;n-gpu-layers = 99 Can't get GPU working in docker (haven't looked into it yet)
; Context length
c = 4096
; Batch size equal to context len
batch-size = 4096
ubatch-size = 2048
; Flash attention
;fa = 1

;mlock - Might use later (also might cause excessive memory usage)

[Qwen3-8B-Instruct-No-Think]
model = /models/Qwen3-8B-Q5_K_M.gguf
chat-template-kwargs = {"enable_thinking": false}

[Qwen3-8B-Instruct-Think]
model = /models/Qwen3-8B-Q5_K_M.gguf
embedding = false
chat-template-kwargs = {"enable_thinking": true}

[Qwen3-8B-Instruct-Embed]
model = /models/Qwen3-8B-Q5_K_M.gguf
embedding = true
pooling = mean
