services:
  chat-interface:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - LLAMA_SERVER=http://127.0.0.1:8080
      - LLAMA_BASE_URL=http://llama-server:8080
      - WEAVIATE_BASE_URL=127.0.0.1:8081
      - WEAVIATE_BASE_URL_ALT="llama-server:8080"
      - LLAMA_API_KEY=not-needed
      - CHAT_MODEL=Qwen2.5-7B-Instruct-Q4_K_M
      - EMBED_MODEL=Qwen3-Embedding-8B-Q5_K_M

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    #platform: linux/arm64 # Specify arm64 for mac
    ports:
      - 8080:8080
    volumes:
      - ./models:/models
      - ./models.ini:/models.ini
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--models-preset"
      - "/models.ini"
      - "--models-dir" # Enables multiple models on one server
      - "/models"
      - "--models-autoload"
      - "--models-max"
      - "1"
      - "--metrics"
      - "--verbose"

  weaviate-server:
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.7
    volumes:
      - ./vector-db:/vector-db
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --scheme
      - http
    ports:
      - 8081:8081
      - 50051:50051
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 8
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/vector-db" # Must match the value after `:` in `volumes` above
      ENABLE_MODULES: "text2vec-openai,generative-openai"
      OPENAI_APIKEY: "not-needed"
      OPENAI_BASEURL: "http://llama-server:8080/"
      CLUSTER_HOSTNAME: "node1" # Can be set to any name
      LOG_LEVEL: "debug"

volumes:
  vector-db:
